[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1can"
version = "2.0.0"
description = "Stream real Formula 1 telemetry over CAN, receive it, analyse it."
authors = [{ name = "Nitish Sundarraj" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["python-can>=4.3", "msgpack>=1.0", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "cantools>=39", "fastf1>=3.3"]

[project.scripts]
f1can = "f1can.__main__:main"

[tool.setuptools]
packages = ["f1can"]

[tool.pytest.ini_options]
testpaths = ["tests"]
